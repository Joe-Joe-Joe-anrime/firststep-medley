const nav=document.getElementById('nav'),main=document.getElementById('main'),pool=document.getElementById('audioPool');
const playBtn=document.getElementById('playBtn'),nowTitle=document.getElementById('nowTitle'),nowSub=document.getElementById('nowSub'),clock=document.getElementById('clock'),seek=document.getElementById('seek');
const audios=new Map();let currentAudio=null,currentTrack=null,currentBlock=null,opSeq=0;
function fmt(v){if(!Number.isFinite(v))return '0:00';v=Math.max(0,Math.floor(v));return Math.floor(v/60)+':'+String(v%60).padStart(2,'0')}
function waitEvent(el,name,timeout=6000){return new Promise((resolve,reject)=>{let done=false;const f=()=>{if(done)return;done=true;clearTimeout(to);resolve()};const to=setTimeout(()=>{if(done)return;done=true;el.removeEventListener(name,f);reject(new Error(name+' timeout'))},timeout);el.addEventListener(name,f,{once:true})})}
function makeAudio(t){const a=document.createElement('audio');a.preload='metadata';a.src=t.audio;a.playsInline=true;a.dataset.track=String(t.id);pool.appendChild(a);audios.set(t.id,a);try{a.load()}catch(e){}a.addEventListener('play',()=>{for(const other of audios.values())if(other!==a&&!other.paused)other.pause();currentAudio=a;playBtn.textContent='❚❚'});a.addEventListener('pause',()=>{if(currentAudio===a)playBtn.textContent='▶'});a.addEventListener('timeupdate',()=>{if(currentAudio!==a)return;clock.textContent=`${fmt(a.currentTime)} / ${fmt(a.duration)}`;seek.value=a.duration?Math.round(a.currentTime/a.duration*1000):0});return a}
tracks.forEach(makeAudio);
function clearPlaying(){document.querySelectorAll('.block.playing').forEach(x=>x.classList.remove('playing'))}
async function seekPlay(t,b){const token=++opSeq;currentTrack=t;currentBlock=b;clearPlaying();document.querySelectorAll(`[data-track="${t.id}"][data-start="${b.start}"]`).forEach(x=>x.classList.add('playing'));nowTitle.textContent=t.title;nowSub.textContent=`${b.section}　${b.cue||''}`;const a=audios.get(t.id);currentAudio=a;const target=Math.max(0,Number.isFinite(b.pdfStart)?b.pdfStart:b.start);try{if(a.readyState<1){const oldMuted=a.muted;a.muted=true;const pp=a.play().catch(()=>{});try{await waitEvent(a,'loadedmetadata',7000)}catch(e){}if(token!==opSeq)return;if(Number.isFinite(a.duration))a.currentTime=Math.min(target,Math.max(0,a.duration-.05));else a.currentTime=target;try{await Promise.race([waitEvent(a,'seeked',2500),new Promise(r=>setTimeout(r,250))])}catch(e){}a.muted=oldMuted;if(a.paused)await a.play();else await pp}else{a.pause();if(Number.isFinite(a.duration))a.currentTime=Math.min(target,Math.max(0,a.duration-.05));else a.currentTime=target;try{await Promise.race([waitEvent(a,'seeked',2500),new Promise(r=>setTimeout(r,180))])}catch(e){}if(token!==opSeq)return;await a.play()}}catch(e){nowSub.textContent=`${b.section}　再生ボタンをもう一度押してください`}}
function split(blocks){const cut=Math.ceil(blocks.length/2);return[blocks.slice(0,cut),blocks.slice(cut)]}
function blockEl(t,b){const w=document.createElement('div');w.className='blockWrap';w.style.flexGrow=Math.max(6,parseInt(b.duration.split(':')[1]||'10',10));w.innerHTML=`<div class="timeLabel">${b.span}</div>`;const bt=document.createElement('button');bt.type='button';bt.className='block cat-'+b.cat;bt.dataset.track=t.id;bt.dataset.start=b.start;bt.innerHTML=`<span class="miniPlay">▶</span><strong>${b.section}</strong><div class="cue">${b.cue||''}</div>`;bt.addEventListener('click',()=>seekPlay(t,b));w.appendChild(bt);const d=document.createElement('div');d.className='durLabel';d.textContent=b.duration;w.appendChild(d);return w}
tracks.forEach(t=>{const n=document.createElement('button');n.type='button';n.textContent=t.title;n.addEventListener('click',()=>document.getElementById('song'+t.id).scrollIntoView({behavior:'smooth',block:'start'}));nav.appendChild(n);const s=document.createElement('section');s.className='song';s.id='song'+t.id;s.innerHTML=`<div class="songHead"><div><div class="songTitle">${t.title}</div><div class="artist">${t.artist}</div></div><div class="meta">Key&nbsp; ${t.key}<br>BPM&nbsp; ${t.bpm}</div><div class="totalLine">全体尺&nbsp; ${t.total}<button class="playFromStart" type="button" aria-label="曲頭から再生">▶</button></div></div><div class="timeline"></div>${t.note?`<div class="songNote">${t.note}</div>`:''}<div class="tableWrap"><table><thead><tr><th>時間帯</th><th>セクション</th><th>尺</th><th>位置キュー</th><th>頭コード</th><th>最後のコード</th></tr></thead><tbody></tbody></table></div>`;s.querySelector('.playFromStart').addEventListener('click',()=>seekPlay(t,{...t.blocks[0],start:0,pdfStart:t.fullStart,section:'曲頭',cue:''}));const tl=s.querySelector('.timeline');split(t.blocks).forEach(arr=>{const row=document.createElement('div');row.className='timelineRow';arr.forEach(b=>row.appendChild(blockEl(t,b)));tl.appendChild(row)});const body=s.querySelector('tbody');t.blocks.forEach(b=>{const tr=document.createElement('tr');tr.className='row-'+b.cat;tr.innerHTML=`<td>${b.span}</td><td class="secCell">${b.section}</td><td>${b.duration}</td><td>${b.cue||''}</td><td>${b.head||''}</td><td>${b.last||''}</td>`;tr.querySelector('.secCell').addEventListener('click',()=>seekPlay(t,b));body.appendChild(tr)});main.appendChild(s)});
playBtn.addEventListener('click',()=>{if(!currentAudio)return;if(currentAudio.paused)currentAudio.play().catch(()=>{});else currentAudio.pause()});document.getElementById('back10').addEventListener('click',()=>{if(currentAudio)currentAudio.currentTime=Math.max(0,currentAudio.currentTime-10)});document.getElementById('fwd10').addEventListener('click',()=>{if(currentAudio&&Number.isFinite(currentAudio.duration))currentAudio.currentTime=Math.min(currentAudio.duration,currentAudio.currentTime+10)});document.getElementById('nextBlock').addEventListener('click',()=>{if(!currentTrack||!currentBlock)return;const i=currentTrack.blocks.indexOf(currentBlock);if(i>=0&&i<currentTrack.blocks.length-1)seekPlay(currentTrack,currentTrack.blocks[i+1])});seek.addEventListener('input',()=>{if(currentAudio&&Number.isFinite(currentAudio.duration))currentAudio.currentTime=currentAudio.duration*(Number(seek.value)/1000)});
